# electron-builder 打包配置
# 输出：release/ 下的 nsis 安装包（不含 OCR 引擎，引擎按需下载，见 scripts/build-ocr-engine.mjs）
appId: com.sgbuddy.desktop
productName: SG Buddy
directories:
  output: release
files:
  - dist/**
  - package.json
  - '!resources/umi-ocr/**'
  - '!resources/chi_sim.traineddata'
  - '!resources/tesseract-portable.zip'
  # 减小安装包体积（Gitee 附件 100MB 限制）
  - '!**/*.map'
  - '!**/tesseract-core-simd*'
  - '!**/tesseract-core-relaxedsimd*'
  - '!**/tesseract-core.wasm*'
  - '!**/tesseract-core.js'
  # 渲染层专用依赖：vite 已把字体/图标打进 dist 产物，node_modules 原包无需随包分发
  # （misans 49MB + lucide-vue-next 36MB，排除后安装包回到 100MB 以内，满足 Gitee 附件上限）
  - '!**/node_modules/misans/**'
  - '!**/node_modules/lucide-vue-next/**'
  - '!**/node_modules/vue/**'
  - '!**/node_modules/vue-router/**'
  - '!**/node_modules/pinia/**'
  - '!**/node_modules/tiny-pinyin/**'
  # 主进程仅 require better-sqlite3/exceljs/koffi/tesseract.js（见 dist/main/index.cjs），
  # 其余 node_modules 均为渲染层/构建链传递依赖，vite 构建时已内联
  - '!**/node_modules/@babel/**'
  # better-sqlite3 只保留运行时 .node 二进制，剔除编译中间产物（obj/pdb/lib 等约 50MB）
  - '!**/node_modules/better-sqlite3/build/Release/obj*'
  - '!**/node_modules/better-sqlite3/build/Release/*.pdb'
  - '!**/node_modules/better-sqlite3/build/Release/*.lib'
  - '!**/node_modules/better-sqlite3/build/Release/*.exp'
  - '!**/node_modules/better-sqlite3/build/Release/*.iobj'
  - '!**/node_modules/better-sqlite3/build/Release/*.ipdb'
  - '!**/node_modules/better-sqlite3/build/Release/test_extension*'
  - '!**/node_modules/better-sqlite3/build/Release/sqlite3.lib'
  - '!**/node_modules/better-sqlite3/deps/**'
  - '!**/node_modules/better-sqlite3/src/**'
asar: true
compression: maximum
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  artifactName: SG-Buddy-Setup-v${version}.exe
  shortcutName: SG Buddy
  deleteAppDataOnUninstall: false
extraResources:
  # 窗口/托盘图标（打包后引用，进程内通过 process.resourcesPath 定位）
  - from: resources/icon.png
    to: icon.png
  # Windows 窗口/任务栏图标：BrowserWindow 的 icon 在 Windows 需要 .ico 才能显示（png 会被忽略）
  - from: resources/icon.ico
    to: icon.ico
  # Tesseract 中文语言包（离线降级 OCR）
  - from: resources/chi_sim.traineddata.gz
    to: ocr/chi_sim.traineddata.gz
  # 7za：运行时解压 OCR 引擎分卷（7-Zip，LGPL）
  - from: resources/7za.exe
    to: 7za.exe
afterPack: scripts/after-pack.cjs
npmRebuild: true
