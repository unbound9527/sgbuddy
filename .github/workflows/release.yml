# 发布流程：推送 vX.Y.Z 格式 tag（如 v1.1.0）触发构建，安装包自动上传到 Gitee Release
# 需要的仓库 Secrets：
#   GITEE_OWNER —— Gitee 用户名（与 electron/services/updater.ts 的 GITEE_OWNER 一致）
#   GITEE_REPO  —— Gitee 仓库名
#   GITEE_TOKEN —— Gitee 私人令牌（设置 → 私人令牌，需 releases 权限）
name: Release

on:
  push:
    tags:
      - 'v*'

# 新建仓库的 GITHUB_TOKEN 默认只读，创建 Release 需要 contents 写权限
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build renderer/main
        run: npm run build

      # GitHub Actions 机器在海外，官方源可达；如需镜像可在本步骤 env 里设置：
      #   ELECTRON_MIRROR / ELECTRON_BUILDER_BINARIES_MIRROR
      - name: Package installer
        # 发布由下一步 publish-gitee.mjs 负责，electron-builder 本身不发布
        # （tag 推送时其默认隐式发布到 GitHub Release，会因缺少 GH_TOKEN 报错）
        run: npx electron-builder --win --publish never

      - name: Publish to Gitee Release
        run: node scripts/publish-gitee.mjs --tag ${{ github.ref_name }} --file "release/SG-Buddy-Setup-${{ github.ref_name }}.exe" --notes "SG Buddy ${{ github.ref_name }} 发布"
        env:
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # GitHub Actions（海外）→ Gitee 上传大文件较慢，放宽单次上传窗口到 90 分钟
          CURL_MAX_TIME: '5400'

      # 安装包同时发一份 GitHub Release：供 Gitee Go 流水线（国内服务器）中转同步到 Gitee
      # 失败不阻塞发布（Gitee 才是国内用户的下载源），但需保留以便中转
      - name: Create GitHub Release with installer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "release/SG-Buddy-Setup-${{ github.ref_name }}.exe"
          gh release create "${{ github.ref_name }}" $exe --title "SG Buddy ${{ github.ref_name }}" --notes "安装包发布，国内下载请走 Gitee Release"
          if ($LASTEXITCODE -ne 0) { gh release upload "${{ github.ref_name }}" $exe --clobber }
